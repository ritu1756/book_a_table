<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <Tailwind-css></Tailwind-css> -->
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


     <!-- <Font-awasome></Font-awasome> -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" >
      
     <style>
        body{
            font-family: "DM Sans" sans-serif;
        }
        h1,h2,h3{
            font-family: "Playfair Display",serif;
        }
     </style>
</head>
<body>
    <div class="bg-white rounded-2xl p-7 md:p-10 shadow-lg">
                <header class="mb-8">
                    <h2 class="text-3xl md:text-4xl font-bold">Reservation Details</h2>
                    <p class="text-gray-500 mt-2">Please fill in your details to reserve a table.</p>
                </header>
                <form class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label for="Name" class="block text-sm font-semibold mb-2">Full Name </label>
                            <input type="text" placeholder="Enter your name" class="w-full border border-gray-300 rounded-lg px-4 py-3">
                        </div>

                         <div>
                            <label for="phone" class="block text-sm font-semibold mb-2">Phone Number</label>
                            <input type="tel" placeholder="+91 XXXXX XXXXX" class="w-full border border-gray-300 rounded-lg px-4 py-3">
                        </div>
                         <div>
                            <label for="Email" class="block text-sm font-semibold mb-2">Email Address </label>
                            <input type="email" placeholder="you@example.com" class="w-full border border-gray-300 rounded-lg px-4 py-3">

                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label for="date" class="block text-sm font-sembold mb-2">Date</label>
                                <input type="date" class="w-full border border-gray-300 rounded-lg px-4 py-3">
                            </div>
                             <div>
                                <label for="time" class="block text-sm font-sembold mb-2">Time</label>
                                <input type="time" class="w-full border border-gray-300 rounded-lg px-4 py-3">
                            </div>
                        </div>
                        <div>
                            <label for="guests" class="block text-sm font-semibold mb-2">Number of Guests</label>
                            <select name="guests" id="guests" class="w-full border border-gray-300 rounded-lg px-4 py-3 bg-white">
                                <option value="1">1 Person</option>
                                <option value="2">2 Person</option>
                                <option value="3">3 Person</option>
                                <option value="4">4 Person</option>
                                <option value="5">5 Person</option>
                                <option value="6">6 Person</option>
                                <option value="7">7 Person</option>
                                <option value="7+">7+ Person</option>
                            </select>
                        </div>
                        <!-- seat -->
                         <div>
                            <div class="text-sm font-semibold mb-3">
                                Seating Prefrence </div>
                                <div class="grid grid-cols-1 sm: grid-cols-3 gap-3">
                            <label for="" class="border border-gray-300 rounded-lg p-3 ">
                                <input type="radio" name="seating"> Indoor
                            </label>
                             <label for="" class="border border-gray-300 rounded-lg p-3 ">
                                <input type="radio" name="seating"> Outdoor
                            </label>
                             <label for="" class="border border-gray-300 rounded-lg p-3 ">
                                <input type="radio" name="seating"> Any Table
                            </label>

                         </div>
                         

                         </div>
                         <div>
                            <label for="message" class="block text-sm font-semibold mb-2">Special Request</label>
                            <textarea name="message" id="message" placeholder="Birthday, Anniversary, dietary request" class="w-full border border-gray-300 rounded-lg px-4 py-3"></textarea>
                         </div>


                    </div>

                </form>
             </div>
        </section>

</body>
</html>
